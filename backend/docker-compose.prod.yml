services:
  reconroll-db:
    image: postgres:15
    container_name: reconroll-db
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  reconroll:
    build:
      context: .
      args:
        - VIDEO_GID=${VIDEO_GID:-44}
    container_name: reconroll
    ports:
      - "8000:8000"
    volumes:
      # No bind mount for ./app — code is baked into the image
      - static_volume:/vol/static
      - media_volume:/vol/media
    env_file:
      - .env.prod
    environment:
      - DJANGO_MODE=production
      - DEBUG=False
    command: sh -c "/scripts/scripts.sh"
    depends_on:
      - reconroll-db
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  prod_db_data:
