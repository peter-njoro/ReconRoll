[uwsgi]
# Django-related settings
chdir = /app
module = config.wsgi:application

# Master and workers
master = true
processes = 4
threads = 2
enable-threads = true
lazy-apps = true
vacuum = true
die-on-term = true

# Serve over HTTP (switch to socket when Nginx proxies)
http = 0.0.0.0:8000

# Static files mapping
static-map = /static=/vol/static
static-map = /media=/vol/media

# Timeout & buffer settings
harakiri = 60
http-timeout = 600
socket-timeout = 600
buffer-size = 65535

# Logging
logto = /var/log/uwsgi/reconroll.log
log-maxsize = 50000000
log-backupname = /var/log/uwsgi/reconroll.log.old
capture-output = true
log-requests = true
log-slow = 1000

# Production: no auto-reload
# py-autoreload intentionally omitted
env = UWSGI_MODE=1
