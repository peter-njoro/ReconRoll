[uwsgi]
# Django-related settings
chdir = /app
module = config.wsgi:application

# Master and workers
master = true
processes = 4
threads = 2
enable-threads = true
lazy-apps = true
vacuum = true
die-on-term = true

# Serve over HTTP (you can switch to socket later if Nginx proxies it)
http = 0.0.0.0:8000

# Static files mapping (adjust if needed)
static-map = /static=/vol/static
static-map = /media=/vol/media

# Timeout & buffer settings
harakiri = 0
http-timeout = 600
socket-timeout = 600
buffer-size = 65535

# Logging
logto = /var/log/uwsgi/reconroll.log

# Environment flag for Django to detect it's in uWSGI mode
env = UWSGI_MODE=1
